# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: frontend

env:
  VITE_API_BASE_URL: "https://personal-task-manager-laik.onrender.com"

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master
    paths:
      - 'client/**' # Only run when files in the client folder change

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Client
        run: npm run build --workspace=personal-task-manager-client

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/dist # Vite builds into the 'dist' folder
          branch: gh-pages
